<style>
/* ============================================================================

   ========================================================================== */

.st-pass { color: var(--pass); } .st-fail { color: var(--fail); } .st-skip { color: var(--skip); } .st-run { color: var(--run); } .st-flaky { color: var(--flaky); } .st-idle { color: var(--fg-3); }
.bg-pass { background: var(--pass); } .bg-fail { background: var(--fail); } .bg-skip { background: var(--skip); } .bg-run { background: var(--run); } .bg-flaky { background: var(--flaky); } .bg-idle { background: var(--fg-3); }
